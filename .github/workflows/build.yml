# .github/workflows/build.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # 如果你的项目将 pico-sdk 作为子模块

      # 如果项目没有将 pico-sdk 作为子模块，则显式克隆
      - name: Install Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk && git submodule update --init

      - name: Copy pico_sdk_import.cmake
        run: cp ~/pico-sdk/external/pico_sdk_import.cmake firmware/

      - name: Configure CMake
        run: |
          cmake -S firmware -B build -G Ninja \
                -DPICO_BOARD=pico \
                -DPICO_SDK_PATH=$HOME/pico-sdk # 指向刚克隆的 SDK
      - name: Build
        run: cmake --build build
