name: Build RP2040-Zero SWIM Test UF2

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          path: pico-sdk
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S firmware -B build -G Ninja -DPICO_BOARD=pico

      - name: Build UF2
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake --build build --parallel

      - name: Upload UF2 and ELF
        uses: actions/upload-artifact@v4
        with:
          name: rp2040zero-swim-test-uf2
          path: |
            build/rp2040zero_swim_test.uf2
            build/rp2040zero_swim_test.elf
            build/rp2040zero_swim_test.bin
          if-no-files-found: error
